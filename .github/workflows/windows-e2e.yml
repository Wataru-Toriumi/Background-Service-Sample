name: Windows E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: FlaUI E2E (Windows)
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Check desktop session and runtime
        run: |
          if (-not [Environment]::UserInteractive) {
            throw 'FlaUI requires an interactive Windows desktop session.'
          }
          dotnet --info
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect .NET installation.' }

      - name: Publish app and run E2E
        run: ./scripts/test-e2e.ps1 -Runtime win-x64

      - name: Upload test results and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-e2e-results-${{ github.run_attempt }}
          path: artifacts/e2e/results/
          if-no-files-found: warn
          retention-days: 14
